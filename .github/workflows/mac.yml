# Builds the macOS DMGs (Apple silicon and Intel) on GitHub's Apple-silicon
# runner, smoke-tests each packaged app (bundled FFmpeg found + a real encode),
# and attaches them to the release. Apple's packaging only runs on macOS,
# which is why this lives here and the Windows exe is built locally.
name: macOS build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the DMGs to (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ffmpeg-static fetched the runner's own binary; swap in the target arch's
      - name: FFmpeg for ${{ matrix.arch }}
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=${{ matrix.arch }} node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg

      - name: Build DMG
        run: |
          npm run build
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Check signature and arch
        run: |
          APP=$(find release -maxdepth 2 -name "Sequence to MP4.app" | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          codesign --verify --deep --verbose=2 "$APP"
          file "$APP/Contents/MacOS/Sequence to MP4"
          file "$APP/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg"

      # the Intel build runs under Rosetta on the Apple-silicon runner
      - name: Rosetta
        if: matrix.arch == 'x64'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Smoke test
        run: |
          npm run sample
          node scripts/smoke.mjs "$APP/Contents/MacOS/Sequence to MP4"

      - name: Attach to release
        run: gh release upload "$TAG" release/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
